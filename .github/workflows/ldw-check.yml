name: Limited deployment window check

# Fails while a limited deployment window is active, so that a required status check can
# hold merges back. Someone with write access to the repository can bypass an active
# window by commenting `/ldw-bypass` on its own line on the pull request and re-running
# this job. Their permission on the repository decides, not their organization role, so
# private organization membership does not stop it working.
#
# The status comes from https://ldw-check.r8admin.com, which this workflow
# authenticates to with a GitHub OIDC token. The calling repository must be
# registered with that service, and the calling job must grant the permissions
# below, e.g.
#
#     ldw:
#       permissions:
#         contents: read
#         id-token: write
#         pull-requests: read
#       uses: replicate/actions/.github/workflows/ldw-check.yml@main
#
# This workflow fails closed: if the status cannot be determined, the check
# fails, and a bypass comment does not hide that failure.
#
# It covers pull requests targeting the default branch, and pushes and manual
# dispatches on it.
#
#   Pull request   Bypassed by the /ldw-bypass comment above.
#   Push           Traced back to the single merged pull request that produced the
#                  commit, so a squash merge inherits the bypass given on that pull
#                  request. A commit that is not exactly one merged pull request (a
#                  direct push, say) cannot be bypassed.
#   Dispatch       There is no pull request, so the person running the workflow bypasses
#                  an active window by entering their own GitHub username in an
#                  `ldw_bypass` input. The calling workflow must declare it:
#
#                      on:
#                        workflow_dispatch:
#                          inputs:
#                            ldw_bypass:
#                              description: >-
#                                Only while a limited deployment window is active: enter
#                                your own GitHub username to deploy anyway.
#                              required: false
#                              type: string
#
#                  It is read from the event payload, so it is not passed down. It is
#                  compared with github.triggering_actor, not github.actor: a re-run
#                  by someone else keeps the original input but not the original
#                  person, so it does not carry the first person's acknowledgment.
#
# deploy-to-k8s.yml calls this workflow before a real deployment, so a deployment
# cannot start while a window is active unless it has such a bypass.

on:
  workflow_call:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      LDW_CHECK_SHA256: 0ac54e25698de4000909eba95de63048a8c9361e19e8ff1cbd637962654dc6eb
    steps:
      - name: Check for an active limited deployment window
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.triggering_actor }}
          # NOTE: Free text from the person running the workflow. It is only ever passed
          # as an environment variable, never interpolated into the script.
          DISPATCH_ACK: ${{ github.event.inputs.ldw_bypass }}
        run: |
          set -euo pipefail
          readonly AUDIENCE='https://ldw-check.r8admin.com/'
          SCRIPT="${RUNNER_TEMP}/ldw-check.bash"
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            MESSAGE='No OIDC token is available. The calling job needs id-token: write;'
            MESSAGE+=' pull requests from forks never get one.'
            echo "::error title=Limited deployment window::${MESSAGE}"
            exit 1
          fi
          TOKEN="$(
            printf 'header = "Authorization: Bearer %s"\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" |
              curl --fail --silent --show-error --max-time 20 --config - --get \
                --data-urlencode "audience=${AUDIENCE}" "${ACTIONS_ID_TOKEN_REQUEST_URL}" |
              jq -er '.value'
          )"
          echo "::add-mask::${TOKEN}"
          printf 'header = "Authorization: Bearer gha:%s"\n' "${TOKEN}" |
            curl --fail --silent --show-error --max-time 30 --retry 3 --config - \
              --output "${SCRIPT}" "${AUDIENCE}gha/${LDW_CHECK_SHA256}"
          echo "${LDW_CHECK_SHA256}  ${SCRIPT}" | sha256sum --check --status
          LDW_CHECK_OIDC_TOKEN="${TOKEN}" bash "${SCRIPT}"
